<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — SmartFertify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(74,124,89,0.07) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(57,70,49,0.08) 0%, transparent 50%),
                #060f05;
        }
        .auth-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
        }
        .auth-box { width: 100%; max-width: 420px; }
        .auth-logo { text-align: center; margin-bottom: 2rem; }
        .auth-logo .brand {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .auth-logo .brand::before { content: '◈'; color: #4a7c59; font-size: 1.7rem; }
        .auth-logo p {
            color: #6b6a5c;
            font-size: 0.8rem;
            font-family: 'JetBrains Mono', monospace;
            margin-top: .4rem;
        }
        .auth-tabs {
            display: flex;
            background: #060f05;
            border: 1px solid rgba(221,212,199,0.06);
            border-radius: 7px;
            padding: 4px;
            margin-bottom: 1.5rem;
            gap: 4px;
        }
        .auth-tab {
            flex: 1; padding: .5rem; text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem; letter-spacing: 0.08em;
            text-transform: uppercase; color: #6b6a5c;
            border-radius: 4px; cursor: pointer; transition: all .2s;
            border: none; background: transparent;
        }
        .auth-tab.active {
            background: rgba(74,124,89,0.15);
            color: #5e9a70;
            border: 1px solid rgba(74,124,89,0.40);
        }
        .auth-card {
            background: #121a10;
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 11px;
            padding: 2rem;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 0 50px rgba(62,86,65,0.06);
        }
        .auth-card .form-label { color: #6b6a5c; font-size: 0.8rem; }
        .auth-card .form-control {
            background: #0c150a;
            border: 1px solid rgba(221,212,199,0.06);
            color: #ffffff;
            border-radius: 7px;
        }
        .auth-card .form-control:focus {
            background: #0c150a;
            border-color: rgba(74,124,89,0.40);
            box-shadow: 0 0 0 3px rgba(74,124,89,0.12);
            color: #ffffff;
        }
        .auth-card .form-control::placeholder { color: #363630; }
        #authAlert { border-radius: 7px; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; }
        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; margin-right: 6px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="auth-page">

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">◈ SmartFertify</a>
        </div>
    </nav>

    <div class="auth-wrap">
        <div class="auth-box">

            <div class="auth-logo">
                <div class="brand">SmartFertify</div>
                <p>Fertilizer Intelligence Platform</p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" id="tabLogin">Login</button>
                <button class="auth-tab" id="tabRegister">Register</button>
            </div>

            <div class="auth-card">
                <!-- Login Form -->
                <div id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="loginEmail" placeholder="you@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="loginPassword" placeholder="••••••••">
                    </div>
                    <button class="btn btn-success w-100 mt-2" id="loginBtn" onclick="handleLogin()">
                        Login →
                    </button>
                </div>

                <!-- Register Form -->
                <div id="registerForm" style="display:none;">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" id="regUsername" placeholder="farmername">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="regEmail" placeholder="you@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="regPassword" placeholder="Min. 6 characters">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="regConfirm" placeholder="••••••••">
                    </div>
                    <button class="btn btn-success w-100 mt-2" id="registerBtn" onclick="handleRegister()">
                        Create Account →
                    </button>
                </div>
            </div>

            <div id="authAlert" class="alert mt-3" style="display:none;"></div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    <script>
        // If already logged in → go straight to dashboard
        if (isLoggedIn()) window.location.href = 'index.html';

        // Tab switching
        document.getElementById('tabLogin').addEventListener('click', () => {
            document.getElementById('tabLogin').classList.add('active');
            document.getElementById('tabRegister').classList.remove('active');
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            hideAlert();
        });
        document.getElementById('tabRegister').addEventListener('click', () => {
            document.getElementById('tabRegister').classList.add('active');
            document.getElementById('tabLogin').classList.remove('active');
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('loginForm').style.display = 'none';
            hideAlert();
        });

        // Enter key support
        document.addEventListener('keydown', e => {
            if (e.key !== 'Enter') return;
            if (document.getElementById('loginForm').style.display !== 'none') handleLogin();
            else handleRegister();
        });

        async function handleLogin() {
            const email    = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            if (!email || !password) { showAlert('Please fill in all fields.', false); return; }
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = '<span class="spinner"></span>Logging in…';
            btn.disabled = true;
            const result = await loginUser(email, password);
            btn.innerHTML = 'Login →';
            btn.disabled = false;
            showAlert(result.message, result.success);
            if (result.success) setTimeout(() => window.location.href = 'index.html', 900);
        }

        async function handleRegister() {
            const username = document.getElementById('regUsername').value.trim();
            const email    = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm  = document.getElementById('regConfirm').value;
            if (!username || !email || !password || !confirm) { showAlert('Please fill in all fields.', false); return; }
            if (password !== confirm) { showAlert('Passwords do not match.', false); return; }
            if (password.length < 6)  { showAlert('Password must be at least 6 characters.', false); return; }
            const btn = document.getElementById('registerBtn');
            btn.innerHTML = '<span class="spinner"></span>Creating account…';
            btn.disabled = true;
            const result = await registerUser(username, email, password);
            btn.innerHTML = 'Create Account →';
            btn.disabled = false;
            showAlert(result.message, result.success);
            if (result.success) setTimeout(() => document.getElementById('tabLogin').click(), 1400);
        }

        function showAlert(message, isSuccess) {
            const el = document.getElementById('authAlert');
            el.textContent = message;
            el.className = `alert mt-3 ${isSuccess ? 'alert-success' : 'alert-danger'}`;
            el.style.display = 'block';
            if (!isSuccess) return;
            setTimeout(() => el.style.display = 'none', 3500);
        }
        function hideAlert() {
            document.getElementById('authAlert').style.display = 'none';
        }
    </script>
</body>
</html>
