services:
  - type: web
    name: smartfertify-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false          # paste this manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value
      - key: FERTILIZER_FRONTEND_DIR
        value: ..            # serves frontend files from project root
    healthCheckPath: /api/health
